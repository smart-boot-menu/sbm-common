name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-uefi, aarch64-unknown-uefi
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo check -p sbm-types -p sbm-protocol --no-default-features --target x86_64-unknown-uefi
      - run: cargo check -p sbm-types -p sbm-protocol --no-default-features --target aarch64-unknown-uefi
      - run: |
          cargo run -p sbm-schema -- schemas
          git diff --exit-code schemas/
