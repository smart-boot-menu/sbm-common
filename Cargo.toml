[workspace]
resolver = "3"
members = [
    "crates/sbm-types",
    "crates/sbm-protocol",
    "crates/sbm-schema",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/smart-boot-menu/sbm-common"

[workspace.dependencies]
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
schemars = { version = "1.0", features = ["derive"] }
sbm-types = { path = "crates/sbm-types", default-features = false }
