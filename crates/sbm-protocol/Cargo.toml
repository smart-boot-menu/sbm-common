[package]
name = "sbm-protocol"
description = "no_std-compatible Smart Boot Menu wire protocols, boot policies, EFI-to-Linux handoff, and signed command envelopes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["std"]
std = ["serde/std", "sbm-types/std"]
schema = ["std", "sbm-types/schema", "dep:schemars"]

[dependencies]
serde.workspace = true
sbm-types.workspace = true
schemars = { workspace = true, optional = true }
